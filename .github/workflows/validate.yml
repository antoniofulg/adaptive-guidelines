name: Validate package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate package invariants
        run: python3 scripts/validate_package.py

      - name: Verify skills installer discovery
        run: npx --yes skills add . --list

      - name: Validate Claude Code plugin
        run: npx --yes @anthropic-ai/claude-code plugin validate .

      - name: Validate Claude Code plugin manifest
        run: npx --yes @anthropic-ai/claude-code plugin validate .claude-plugin/plugin.json

      - name: Install Codex plugin from the published marketplace
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          npx --yes @openai/codex plugin marketplace add .
          npx --yes @openai/codex plugin add adaptive-guidelines@adaptive-guidelines

      - name: Install Claude Code plugin from the published marketplace
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          npx --yes @anthropic-ai/claude-code plugin marketplace add .
          npx --yes @anthropic-ai/claude-code plugin install adaptive-guidelines@adaptive-guidelines --scope user --yes
